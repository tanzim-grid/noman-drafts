.hg-forlater{margin:16px 0 4px;border:1px solid #292f3a;border-radius:12px;background:#11151c}
.hg-forlater-toggle{display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;min-height:42px;padding:8px 12px;background:transparent;border:0;border-radius:12px;color:#cbd1dc;font:600 13px/1.4 inherit;font-family:inherit;cursor:pointer;text-align:left}
.hg-forlater-toggle:hover{background:#ffffff06;color:#fff}
.hg-forlater-toggle:focus-visible{outline:2px solid #22d3ee;outline-offset:2px}
.hg-forlater-chev{transition:transform .16s;flex:0 0 auto}
.hg-forlater[data-open="true"] .hg-forlater-chev{transform:rotate(90deg)}
.hg-forlater-count{color:#8e98aa;font-weight:500}
.hg-forlater-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:10px;padding:4px 12px 12px}
.hg-forlater-list[hidden]{display:none}
.hg-forlater-empty{color:#8e98aa;font-size:12.5px;padding:4px 2px 6px}
.hg-forlater-item{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0;padding:12px 12px 10px;border:1px solid #303845;border-radius:11px;background:#151a22}
.hg-forlater-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-right:34px;font-size:11.5px;color:#8e98aa}
.hg-forlater-tag{padding:1px 7px;border-radius:6px;border:1px solid #3a4452;color:#dce2eb;font-weight:650;font-size:11px}
.hg-forlater-topic{font-size:12px;color:#aeb7c5;overflow-wrap:anywhere}
.hg-forlater-text{font-size:13.5px;line-height:1.6;color:#dce2eb;white-space:pre-wrap;overflow-wrap:anywhere}
.hg-forlater-dates{font-size:11px;color:#8e98aa}
.hg-forlater-actions{display:flex;gap:8px;align-items:center}
.hg-forlater-actions .hg-button{min-height:30px;padding:4px 10px;display:inline-flex;align-items:center;gap:6px}
.hg-forlater-actions .hg-post-link{flex:0 0 auto;min-height:30px;padding:4px 10px;display:inline-flex;align-items:center}
.hg-forlater-item .hg-card-edit{margin-top:0}
.hg-forlater-item[data-approved]{border-color:#4ADE8080}
.hg-forlater-remove{position:absolute;top:8px;right:8px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;padding:0;border-radius:7px;background:transparent;border:1px solid #343e4c;color:#abb6c6;font-size:17px;line-height:1;cursor:pointer}
.hg-forlater-remove:hover{background:#3a1d22;border-color:#e5737f;color:#ffb3bb}
.hg-later-button[aria-pressed="true"]{background:#13313b!important;border-color:#22d3ee!important;color:#89e7f1!important}
.hg-card[data-later]:not(.hg-card--nw){min-height:0!important;opacity:.6}
.hg-card[data-later]:not(.hg-card--nw) .hg-card-text,.hg-card[data-later]:not(.hg-card--nw) .hg-card-footer{display:none!important}
.hg-card[data-later].hg-card--nw{opacity:.6}
.hg-card[data-later]:hover{opacity:1}
.hg-later-chip{margin-top:10px;align-self:flex-start;font-size:11.5px;color:#89e7f1;background:transparent;border:1px dashed #22d3ee80;border-radius:7px;padding:3px 9px;cursor:pointer;font-family:inherit}
.hg-light .hg-forlater{background:#fff;border-color:#dfe3e9;box-shadow:0 1px 3px #0f172a0a}
.hg-light .hg-forlater-toggle{color:#2c3440}
.hg-light .hg-forlater-toggle:hover{background:#f5f6f8;color:#0f141b}
.hg-light .hg-forlater-count,.hg-light .hg-forlater-empty,.hg-light .hg-forlater-meta,.hg-light .hg-forlater-dates{color:#5d6878}
.hg-light .hg-forlater-item{background:#fafbfc;border-color:#e1e5eb}
.hg-light .hg-forlater-item[data-approved]{border-color:#16a34a80}
.hg-light .hg-forlater-tag{border-color:#d3d9e1;color:#2c3440}
.hg-light .hg-forlater-topic{color:#5d6878}
.hg-light .hg-forlater-text{color:#30333a}
.hg-light .hg-forlater-remove{border-color:#d3d9e1;color:#51545c;background:#fff}
.hg-light .hg-forlater-remove:hover{background:#fde8ea;border-color:#e5737f;color:#b42332}
.hg-light .hg-later-button[aria-pressed="true"]{background:#e6f9fc!important;border-color:#0891b2!important;color:#0e7490!important}
.hg-light .hg-later-chip{color:#0e7490;border-color:#0891b280}
@media(max-width:430px){.hg-forlater-list{padding:4px 8px 10px}.hg-forlater-item{padding:11px 10px 9px}}
/* For later: ported 1:1 from the Masum board (tooltips, Edited badge, edit wrapper) */
.hg-forlater-actions > button{position:relative;overflow:visible}
.hg-forlater-actions > button[data-label]:hover::after,.hg-forlater-actions > button[data-label]:focus-visible::after{content:attr(data-label);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#202731;color:#fff;border:1px solid #465160;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:560;line-height:1.35;white-space:nowrap;box-shadow:0 10px 28px #00000080;z-index:40;pointer-events:none;width:max-content;max-width:260px;white-space:normal;text-align:center}
.hg-light .hg-forlater-actions > button[data-label]:hover::after,.hg-light .hg-forlater-actions > button[data-label]:focus-visible::after{background:#202731;color:#fff;border-color:#465160}
.hg-forlater .hg-edited-badge{color:#FACC15;border:1px solid #FACC1580}
.hg-forlater .hg-forlater-item .hg-card-edit{display:flex;flex-direction:column;gap:10px;margin-top:0;flex:1;width:auto;min-height:0;resize:none;background:transparent!important;border:0!important;border-radius:0;padding:0;box-shadow:none;font-size:inherit;line-height:inherit;letter-spacing:normal;white-space:normal}
.hg-forlater .hg-card-edit textarea{width:100%;min-height:120px;resize:vertical;background:#10151c;color:#e7ebf2;border:1px solid #323a46;border-radius:8px;padding:10px 12px;font:inherit;line-height:1.66;white-space:pre-wrap}
.hg-light .hg-forlater .hg-card-edit textarea{background:#fff;color:#202124;border-color:#c9d0d8}
.hg-forlater .hg-card-edit-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:0}
.hg-forlater .hg-card-edit-meta{font-size:11.5px;color:#8894a4}
.hg-forlater .hg-card-edit-err{color:#F87171;font-size:12px}
